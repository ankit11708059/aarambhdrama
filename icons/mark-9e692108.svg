<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The Aarambh Drama Company mark: an "A" drawn by a spotlight.
    The legs are the two edges of the beam falling from a lamp at the apex,
    the crossbar is the edge of the stage, and the beam lands as a pool of
    light. "Aarambh" is the beginning: the moment the light comes on.
    Gold on a burgundy disc.
  -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#a8294c"/>
      <stop offset="1" stop-color="#5c0f24"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dcaa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e2bd72" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="1" stop-color="#f3dcaa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#disc)"/>
  <circle cx="32" cy="32" r="27.6" fill="none" stroke="#e2bd72" stroke-opacity="0.55" stroke-width="1.1"/>
  <path d="M32 16L19.5 46H44.5Z" fill="url(#beam)"/>
  <path d="M19.5 46L32 15.5L44.5 46" fill="none" stroke="#e2bd72" stroke-width="4" stroke-linejoin="miter"/>
  <path d="M24.4 34.2H39.6" stroke="#e2bd72" stroke-width="3.2"/>
  <circle cx="32" cy="14.5" r="5" fill="url(#lamp)"/>
  <ellipse cx="32" cy="47.6" rx="13" ry="2.4" fill="#f3dcaa"/>
</svg>
